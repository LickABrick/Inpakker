version: 2

project_name: inpakker

builds:
  - id: inpakker
    main: .
    binary: inpakker
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - inpakker
    formats:
      - zip
    name_template: "inpakker_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - docs/**

checksum:
  name_template: "inpakker_v{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - id: release-checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: openssl
    args:
      - dgst
      - -sha256
      - -sign
      - "{{ .Env.INPAKKER_SIGNING_KEY }}"
      - -out
      - "${signature}"
      - "${artifact}"

changelog:
  use: github-native

release:
  prerelease: auto
