name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.2.3."
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tags must be annotated."
            exit 1
          fi

      - name: Verify tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build packages
        run: go build ./...

      - name: Prepare release-signing key
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.INPAKKER_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "INPAKKER_RELEASE_SIGNING_KEY is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/inpakker-release-signing-key.pem"
          echo "INPAKKER_SIGNING_KEY=$RUNNER_TEMP/inpakker-release-signing-key.pem" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/inpakker_v*.zip
            dist/inpakker_v*_checksums.txt
            dist/inpakker_v*_checksums.txt.sig

      - name: Remove release-signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/inpakker-release-signing-key.pem"
